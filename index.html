<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaGuard</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--panel:#fbfdfc;--ink:#14313a;--mute:#5d7479;--line:#cddad8;--ok:#1f7a80;--warn:#c98a12;--bad:#b8532a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1e23;--panel:#162a31;--ink:#dce8e8;--mute:#8fa8ac;--line:#294048;--ok:#4cc0c7;--warn:#e3a92f;--bad:#e8825a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:800;margin:0}
#conn{font-size:.9rem;color:var(--mute)}
#banner{margin:16px 0;padding:16px 20px;border-left:8px solid var(--ok);background:var(--panel);font-size:1.25rem;font-weight:600}
#banner small{display:block;font-weight:400;font-size:.95rem;color:var(--mute)}
#banner.SUSPECT{border-color:var(--warn)}
#banner.LEAK,#banner.BURST{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
h2{font-size:1rem;margin:0 0 10px;font-weight:600;color:var(--mute)}
.nums{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.nums b{display:block;font-size:1.8rem;font-weight:800;line-height:1.1}
.nums span{font-size:.85rem;color:var(--mute)}
svg{width:100%;height:auto;display:block}
.pipe{stroke:var(--ok);stroke-width:14;fill:none}
.water{stroke:var(--bg);stroke-width:4;fill:none;stroke-dasharray:10 14;animation:run 1s linear infinite;animation-duration:var(--spd,0s)}
@keyframes run{to{stroke-dashoffset:-24}}
@media(prefers-reduced-motion:reduce){.water{animation:none}}
#valve{transition:transform .3s;transform-origin:300px 70px}
button{font:inherit;font-weight:600;padding:8px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;font-size:.9rem}
#log li{padding:6px 0;border-top:1px solid var(--line)}
#log .t{color:var(--mute);margin-right:6px}
#log .LEAK,#log .BURST,#log .SHUTOFF{color:var(--bad);font-weight:600}
#log .SUSPECT{color:var(--warn);font-weight:600}
label{font-size:.85rem;color:var(--mute)}
input{font:inherit;width:100%;padding:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<main>
<header>
  <h1>AquaGuard</h1>
  <div id="conn" role="status">Connecting…</div>
</header>

<div id="banner" class="NORMAL"><span id="bmain">Waiting for the sensor…</span><small id="bsub"></small></div>

<div class="grid">
  <section class="panel">
    <h2>Main line</h2>
    <svg viewBox="0 0 600 140" role="img" aria-label="Water main, shut-off valve and house">
      <path class="pipe" d="M20 70H580"/>
      <path class="water" id="water" d="M20 70H580"/>
      <g id="valve">
        <rect x="270" y="40" width="60" height="60" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
        <line id="vbar" x1="300" y1="48" x2="300" y2="92" stroke="var(--bad)" stroke-width="8" opacity="0"/>
      </g>
      <text x="20" y="125" fill="var(--mute)" font-size="14">Street supply</text>
      <text x="300" y="125" text-anchor="middle" fill="var(--mute)" font-size="14" id="vlabel">Valve open</text>
      <text x="580" y="125" text-anchor="end" fill="var(--mute)" font-size="14">House</text>
    </svg>
    <div class="nums">
      <div><b id="flow">–</b><span>litres / min</span></div>
      <div><b id="psi">–</b><span>psi</span></div>
      <div><b id="score">–</b><span>leak confidence %</span></div>
      <div><b id="lost">–</b><span>litres lost</span></div>
    </div>
    <canvas id="chart" height="150" style="margin-top:16px"></canvas>
  </section>

  <aside>
    <section class="panel" style="margin-bottom:16px">
      <h2>Controls</h2>
      <div class="row">
        <button id="bclose">Close valve</button>
        <button id="breset" class="primary">Reopen and reset</button>
      </div>
      <div class="row"><button id="bnotify">Turn on alerts</button></div>
      <label for="topic">Topic prefix (must match main.py)</label>
      <input id="topic" value="aquaguard-mlh-CHANGE-ME/home01">
    </section>
    <section class="panel">
      <h2>Events</h2>
      <ul id="log"><li>No events yet. Turn the flow dial to a low, steady value to simulate a leak.</li></ul>
    </section>
  </aside>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
let client, base;
try { const s = localStorage.getItem("aqTopic"); if (s) $("topic").value = s; } catch (e) {}

const MSG = {
  NORMAL:  ["Water use looks normal", "No continuous low flow detected."],
  SUSPECT: ["Possible hidden leak", "Water has been trickling without a pause. Checking if it continues."],
  LEAK:    ["Leak confirmed: main valve closed", "Steady low flow never stopped. Water supply was shut off automatically."],
  BURST:   ["Burst pipe: main valve closed", "Very high flow with a pressure collapse. Supply shut off immediately."]
};

const chart = new Chart($("chart"), {
  type: "line",
  data: { labels: [], datasets: [
    { label: "Flow (L/min)", data: [], borderColor: "#1f7a80", pointRadius: 0, tension: .2, yAxisID: "y" },
    { label: "Pressure (psi)", data: [], borderColor: "#b8532a", pointRadius: 0, tension: .2, yAxisID: "y1" }
  ]},
  options: { animation: false, responsive: true, scales: {
    x: { display: false },
    y: { min: 0, suggestedMax: 5, title: { display: true, text: "L/min" } },
    y1: { position: "right", min: 0, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: "psi" } }
  }}
});

function connect() {
  base = $("topic").value.trim();
  try { localStorage.setItem("aqTopic", base); } catch (e) {}
  if (client) client.end(true);
  client = mqtt.connect(BROKER, { reconnectPeriod: 3000 });
  client.on("connect", () => {
    $("conn").textContent = "Connected to broker";
    client.subscribe([base + "/telemetry", base + "/event"]);
  });
  client.on("reconnect", () => $("conn").textContent = "Reconnecting…");
  client.on("offline", () => $("conn").textContent = "Offline");
  client.on("message", (t, p) => {
    let d; try { d = JSON.parse(p.toString()); } catch (e) { return; }
    t.endsWith("/telemetry") ? onTelemetry(d) : onEvent(d);
  });
}

let lastState = "NORMAL", lastSeen = 0;
function onTelemetry(d) {
  lastSeen = Date.now();
  $("flow").textContent = d.flow.toFixed(2);
  $("psi").textContent = d.psi.toFixed(1);
  $("score").textContent = d.score;
  $("lost").textContent = d.lost_l.toFixed(2);
  const closed = d.valve === "CLOSED";
  $("vbar").setAttribute("opacity", closed ? 1 : 0);
  $("vlabel").textContent = closed ? "Valve closed" : "Valve open";
  $("water").style.setProperty("--spd", d.flow > 0.02 ? Math.max(0.15, 1.6 / (1 + d.flow)) + "s" : "0s");
  $("water").style.opacity = d.flow > 0.02 ? 1 : 0;
  const m = MSG[d.state] || MSG.NORMAL;
  $("banner").className = d.state;
  $("bmain").textContent = m[0];
  $("bsub").textContent = d.state === "SUSPECT" ? m[1] + " (" + d.low_s + " s so far)" : m[1];
  lastState = d.state;

  const c = chart.data;
  c.labels.push(d.up); c.datasets[0].data.push(d.flow); c.datasets[1].data.push(d.psi);
  if (c.labels.length > 120) { c.labels.shift(); c.datasets.forEach(s => s.data.shift()); }
  chart.update();
}

function onEvent(d) {
  const ul = $("log");
  if (ul.firstChild && !ul.firstChild.dataset.ev) ul.innerHTML = "";
  const li = document.createElement("li");
  li.dataset.ev = 1; li.className = d.type;
  const t = document.createElement("span"); t.className = "t"; t.textContent = new Date().toLocaleTimeString();
  li.append(t, d.type + ": " + (d.msg || ""));
  ul.prepend(li);
  if (["SUSPECT", "LEAK", "BURST", "SHUTOFF"].includes(d.type)) alertUser(d);
}

function alertUser(d) {
  beep(d.type === "SUSPECT" ? 1 : 3);
  if ("Notification" in window && Notification.permission === "granted")
    new Notification("AquaGuard: " + d.type, { body: d.msg || "Check your water system." });
}
function beep(n) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < n; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; g.gain.value = 0.1;
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + i * 0.35); o.stop(ac.currentTime + i * 0.35 + 0.2);
    }
  } catch (e) {}
}

const cmd = c => client && client.publish(base + "/cmd", c);
$("bclose").onclick = () => cmd("close");
$("breset").onclick = () => cmd("reset");
$("bnotify").onclick = () => { if ("Notification" in window) Notification.requestPermission().then(p => $("bnotify").textContent = p === "granted" ? "Alerts on" : "Alerts blocked"); beep(1); };
$("topic").onchange = connect;

setInterval(() => { if (lastSeen && Date.now() - lastSeen > 5000) { $("bmain").textContent = "No data from the sensor"; $("bsub").textContent = "Check that the Wokwi simulation is running."; $("banner").className = "SUSPECT"; } }, 2000);
connect();
</script>
</body>
</html>
